name: Build and Deploy to AWS Server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Apply (Create Server)
        env:
          TF_VAR_key_name: ${{ secrets.EC2_KEY_NAME }}
        run: |
          terraform init
          terraform apply -auto-approve

      - name: Get Server IP
        id: tf_out
        run: echo "server_ip=$(terraform output -raw server_ip)" >> $GITHUB_OUTPUT

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mqb-it-app:latest

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ steps.tf_out.outputs.server_ip }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          script: |
            # Docker Hub se latest image pull karein
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/mqb-it-app:latest
            
            # Purana container band aur delete karein (agar chal raha ho)
            docker stop mqb-app || true
            docker rm mqb-app || true
            
            # Naya container port 80 par run karein
            docker run -d --name mqb-app -p 80:80 --restart unless-stopped ${{ secrets.DOCKERHUB_USERNAME }}/mqb-it-app:latest
            
            # Faltu images clean karein
            docker image prune -f